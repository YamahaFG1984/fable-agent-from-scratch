<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从零构建 AI Agent · 目录</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#eef1ef;
    --surface:#ffffff;
    --surface-2:#e6e9e5;
    --ink:#1a2233;
    --ink-dim:#4b5566;
    --line:#d5d9d2;
    --accent:#b5551f;
    --accent-ink:#7a3a12;
    --accent-soft:#f3e3d6;
    --accent2:#276b64;
    --accent2-soft:#dcece9;
    --code-bg:#1a2233;
    --code-ink:#e7ecef;
    --code-accent:#e8935a;
    --good:#2f7a4f;
    --good-soft:#dcefe1;
    --warn:#a5730b;
    --warn-soft:#f6ecd6;
    --bad:#a5341f;
    --bad-soft:#f6ddd6;
    --shadow: 0 1px 2px rgba(20,26,20,.06), 0 8px 24px -12px rgba(20,26,20,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10151c;
      --surface:#171e28;
      --surface-2:#1d2530;
      --ink:#e7ecf1;
      --ink-dim:#a7b1c0;
      --line:#2a323d;
      --accent:#e8935a;
      --accent-ink:#f4b384;
      --accent-soft:#3a2a1e;
      --accent2:#5fc1b6;
      --accent2-soft:#173330;
      --code-bg:#0c1016;
      --code-ink:#e7ecf1;
      --code-accent:#e8935a;
      --good:#5fd08a;
      --good-soft:#123423;
      --warn:#e0b34f;
      --warn-soft:#3a2e12;
      --bad:#e88a76;
      --bad-soft:#3a1d16;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10151c;
    --surface:#171e28;
    --surface-2:#1d2530;
    --ink:#e7ecf1;
    --ink-dim:#a7b1c0;
    --line:#2a323d;
    --accent:#e8935a;
    --accent-ink:#f4b384;
    --accent-soft:#3a2a1e;
    --accent2:#5fc1b6;
    --accent2-soft:#173330;
    --code-bg:#0c1016;
    --code-ink:#e7ecf1;
    --code-accent:#e8935a;
    --good:#5fd08a;
    --good-soft:#123423;
    --warn:#e0b34f;
    --warn-soft:#3a2e12;
    --bad:#e88a76;
    --bad-soft:#3a1d16;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
    font-size:16px;
    line-height:1.7;
  }
  h1,h2,h3,h4{
    font-family:"Source Serif 4","Noto Serif SC",Georgia,serif;
    color:var(--ink);
    text-wrap:balance;
    margin:0;
  }
  code, pre, .mono, .eyebrow, .tag, .kbd{
    font-family:"IBM Plex Mono","Noto Sans SC",monospace;
  }
  a{color:var(--accent-ink);}
  ::selection{ background:var(--accent-soft); }

  /* ---------- layout shell ---------- */
  .shell{
    display:grid;
    grid-template-columns: 272px minmax(0,1fr);
    min-height:100vh;
  }
  .sidebar{
    position:sticky; top:0; align-self:start;
    height:100vh;
    overflow-y:auto;
    border-right:1px solid var(--line);
    background:var(--surface);
    padding:22px 18px 40px;
  }
  .brand{
    display:flex; flex-direction:column; gap:4px;
    padding-bottom:16px; margin-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .brand .kicker{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:600;
  }
  .brand h1{ font-size:21px; line-height:1.25; }
  .brand .sub{ font-size:12.5px; color:var(--ink-dim); }

  nav.toc{ display:flex; flex-direction:column; gap:2px; }
  nav.toc a{
    display:flex; align-items:baseline; gap:9px;
    padding:7px 9px; border-radius:7px;
    text-decoration:none; color:var(--ink-dim);
    font-size:13.5px;
    border-left:2px solid transparent;
  }
  nav.toc a .num{
    font-family:"IBM Plex Mono",monospace; font-size:11px;
    color:var(--ink-dim); min-width:20px;
  }
  nav.toc a:hover{ background:var(--surface-2); color:var(--ink); }
  nav.toc a.active{
    background:var(--accent-soft); color:var(--accent-ink);
    border-left-color:var(--accent); font-weight:600;
  }
  nav.toc .group-label{
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-dim); opacity:.75;
    margin:14px 9px 4px; font-weight:600;
  }
  nav.toc .group-label:first-child{ margin-top:2px; }

  .menu-btn{
    display:none; position:fixed; z-index:40; top:14px; left:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    width:40px; height:40px; align-items:center; justify-content:center;
    box-shadow:var(--shadow); color:var(--ink);
  }

  main{ min-width:0; }
  .content{
    max-width:760px;
    margin:0 auto;
    padding:56px 28px 120px;
  }

  /* ---------- hero / cover ---------- */
  .hero{
    padding-bottom:38px; margin-bottom:44px;
    border-bottom:1px solid var(--line);
  }
  .hero .kicker{
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); font-weight:600; margin-bottom:10px;
  }
  .hero h1{ font-size:40px; line-height:1.15; margin-bottom:14px; }
  .hero .dek{ font-size:17px; color:var(--ink-dim); max-width:60ch; }
  .hero .meta{
    display:flex; gap:18px; flex-wrap:wrap;
    margin-top:22px; font-size:13px; color:var(--ink-dim);
  }
  .hero .meta b{ color:var(--ink); font-weight:600; }

  /* ---------- chapter chrome ---------- */
  section.chapter{
    padding-top:64px; margin-top:-8px;
    scroll-margin-top:20px;
  }
  section.chapter:first-of-type{ padding-top:0; }
  .ch-eyebrow{
    display:flex; align-items:center; gap:10px;
    font-family:"IBM Plex Mono",monospace;
    font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); font-weight:600; margin-bottom:10px;
  }
  .ch-eyebrow .line{ height:1px; flex:1; background:var(--line); }
  section.chapter h2{ font-size:29px; line-height:1.25; margin-bottom:8px; }
  section.chapter .dek{ color:var(--ink-dim); font-size:15.5px; max-width:64ch; margin-bottom:28px; }

  h3.subhead{
    font-size:18px; margin:34px 0 12px;
    padding-top:4px;
  }
  h3.subhead .n{ color:var(--accent); font-family:"IBM Plex Mono",monospace; font-size:14px; margin-right:8px; }

  p{ margin:0 0 14px; max-width:66ch; }
  ul.plain, ol.plain{ margin:0 0 16px; padding-left:1.3em; max-width:64ch; }
  ul.plain li, ol.plain li{ margin-bottom:6px; }
  strong{ color:var(--ink); }
  .accent-word{ color:var(--accent-ink); font-weight:600; }

  /* ---------- code panel ---------- */
  .code-panel{
    background:var(--code-bg); color:var(--code-ink);
    border-radius:11px; overflow:hidden;
    margin:16px 0 22px; box-shadow:var(--shadow);
  }
  .code-panel .tab{
    display:flex; align-items:center; gap:8px;
    padding:8px 14px; font-size:11.5px;
    font-family:"IBM Plex Mono",monospace; letter-spacing:.03em;
    color:#9fb3c8; background:rgba(255,255,255,.04);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .code-panel .tab .dot{ width:8px;height:8px;border-radius:50%; background:var(--code-accent); opacity:.8;}
  .code-panel pre{
    margin:0; padding:14px 16px 16px; overflow-x:auto;
    font-size:12.8px; line-height:1.65;
  }
  .code-panel code{ font-family:"IBM Plex Mono",monospace; white-space:pre; }
  .tok-c{ color:#8592a6; } /* comment */
  .tok-k{ color:#e8935a; } /* keyword */
  .tok-s{ color:#8fc7a8; } /* string */
  .tok-f{ color:#7fb5e8; } /* function/name */
  .tok-n{ color:#e7ecf1; }

  code.inline{
    background:var(--surface-2); border:1px solid var(--line);
    padding:1.5px 6px; border-radius:5px; font-size:.87em;
  }

  /* ---------- figures / diagrams ---------- */
  figure.diagram{
    margin:24px 0 26px; padding:18px 18px 14px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:13px; box-shadow:var(--shadow);
  }
  figure.diagram svg{ display:block; width:100%; height:auto; overflow:visible; }
  figure.diagram figcaption{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
    font-size:12.5px; color:var(--ink-dim);
  }
  figure.diagram figcaption b{ color:var(--ink); }
  .svg-label{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; fill:currentColor; }
  .svg-title{ font-family:"IBM Plex Sans",sans-serif; font-size:12.5px; font-weight:600; fill:currentColor; }
  .svg-dim{ opacity:.62; }

  /* ---------- callouts ---------- */
  .callout{
    border-radius:12px; padding:16px 18px; margin:20px 0;
    border:1px solid var(--line); background:var(--surface);
  }
  .callout.takeaway{
    background:var(--accent-soft); border-color:transparent;
  }
  .callout.takeaway .head{
    display:flex; align-items:center; gap:8px;
    font-family:"IBM Plex Mono",monospace; font-size:11.5px;
    letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:700; margin-bottom:10px;
  }
  .callout.takeaway ol{ margin:0; padding-left:1.2em; }
  .callout.takeaway li{ margin-bottom:6px; color:var(--ink); }
  .callout.note{ background:var(--accent2-soft); }
  .callout.note .head{ color:var(--accent2); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; font-family:"IBM Plex Mono",monospace; margin-bottom:8px;}

  .pairgrid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
    margin:18px 0;
  }
  .pairgrid .card{
    border:1px solid var(--line); border-radius:11px; padding:13px 15px;
    background:var(--surface);
  }
  .pairgrid .card h4{ font-size:13.5px; margin-bottom:6px; font-family:"IBM Plex Sans"; }
  .pairgrid .card p{ font-size:13px; color:var(--ink-dim); margin:0; }
  @media (max-width:640px){ .pairgrid{ grid-template-columns:1fr; } }

  table.reftable{
    width:100%; border-collapse:collapse; margin:16px 0 22px;
    font-size:13.5px;
  }
  table.reftable th{
    text-align:left; font-family:"IBM Plex Mono",monospace; font-size:11px;
    letter-spacing:.05em; text-transform:uppercase; color:var(--ink-dim);
    padding:8px 10px; border-bottom:1px solid var(--line);
  }
  table.reftable td{
    padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;
  }
  table.reftable tr:last-child td{ border-bottom:none; }
  table.reftable code{ font-size:12px; }

  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:2.5px 9px; border-radius:999px; font-size:11.5px; font-weight:600;
    font-family:"IBM Plex Mono",monospace; white-space:nowrap;
  }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.bad{ background:var(--bad-soft); color:var(--bad); }
  .pill::before{ content:"●"; font-size:8px; }

  .chapfoot{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:46px; padding-top:16px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-dim);
  }

  footer.end{
    margin-top:60px; padding-top:26px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-dim);
  }

  @media (max-width: 900px){
    .shell{ grid-template-columns: 1fr; }
    .sidebar{
      position:fixed; inset:0 auto 0 0; width:78vw; max-width:300px;
      transform:translateX(-100%); transition:transform .22s ease;
      z-index:50; box-shadow:var(--shadow);
    }
    .sidebar.open{ transform:translateX(0); }
    .menu-btn{ display:flex; }
    .content{ padding-top:76px; }
    .overlay{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:45;
    }
    .overlay.show{ display:block; }
    .pairgrid{ grid-template-columns:1fr; }
  }
</style>
<style>
  .idx-wrap{ max-width:680px; margin:0 auto; padding:64px 28px 100px; }
  .idx-list{ list-style:none; margin:28px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .idx-list a{ display:flex; gap:12px; align-items:baseline; padding:14px 16px; border:1px solid var(--line); border-radius:11px; text-decoration:none; color:var(--ink); background:var(--surface); font-size:15px; }
  .idx-list a:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .idx-list .num{ font-family:"IBM Plex Mono",monospace; color:var(--accent); font-size:13px; min-width:22px; }
</style>
</head>
